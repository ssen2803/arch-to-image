# Publishes only the two HTML decks and their index page, not the whole repository.
name: slides on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["slides/*.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: slides
      - name: Collect the pages
        run: |
          mkdir _site
          cp slides/index.html slides/proposal.html slides/midterm.html _site/
          ls -l _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
